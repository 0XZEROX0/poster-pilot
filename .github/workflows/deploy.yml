name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The built site is pushed to the gh-pages branch, which GitHub Pages serves.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # .env is not committed: the FIREBASE_ENV repository secret holds the whole file (same lines
      # as .env.example). Without the secret the site is built in demo mode, with sample data.
      - name: Build web app
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: |
          printf '%s\n' "$FIREBASE_ENV" | tr -d '\r' > .env
          grep -q '^VITE_FIREBASE_API_KEY=.' .env || echo "::warning::No FIREBASE_ENV secret: building in demo mode"
          npm run build
      - name: Publish to the gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
