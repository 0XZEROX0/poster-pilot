name: n8n watch

# Checks from GitHub's servers (outside Egypt) that the n8n server answers.
# Sends ONE WhatsApp message when it goes offline and ONE when it is back.
# Needs repository secrets (Settings > Secrets and variables > Actions):
#   WHATSAPP_PHONE   the WhatsApp number that gets alerts, with country code, e.g. +2010xxxxxxxx
# WhatsApp through Green-API (free Developer plan, a linked WhatsApp sends it):
#   GREENAPI_URL     apiUrl from the Green-API console, e.g. https://7105.api.greenapi.com
#   GREENAPI_ID      idInstance
#   GREENAPI_TOKEN   apiTokenInstance
# Or WhatsApp through CallMeBot:
#   WHATSAPP_APIKEY  the key CallMeBot sends you after activation
# Telegram (used too if set):
#   TELEGRAM_BOT_TOKEN  from @BotFather. Press Start on the bot once; the chat
#                       is found by itself (TELEGRAM_CHAT_ID is optional).
# Run it by hand (Actions > n8n watch > Run workflow) with "test" ticked to get a test message.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Send a test message now
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: n8n-watch
  cancel-in-progress: false

env:
  HEALTH_URL: https://zero.tail0ea3a8.ts.net/healthz

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Load last known state
        uses: actions/cache/restore@v4
        with:
          path: .n8n-watch
          key: n8n-watch-${{ github.run_id }}
          restore-keys: n8n-watch-

      - name: Check n8n and alert on change
        id: check
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          GREENAPI_ID: ${{ secrets.GREENAPI_ID }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: |
          set -u
          mkdir -p .n8n-watch
          prev=$(cat .n8n-watch/state 2>/dev/null || echo up)
          since=$(cat .n8n-watch/since 2>/dev/null || date -u +%s)

          changed=false

          # Telegram: if no chat id is saved yet, find it from the last message
          # someone sent the bot (send the bot /start once), then remember it.
          chat="$TELEGRAM_CHAT_ID"
          if [ -z "$chat" ]; then chat=$(cat .n8n-watch/chat 2>/dev/null || true); fi
          new_chat=false
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -z "$chat" ]; then
            chat=$(curl -sS -m 30 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getUpdates" \
              | jq -r '[.result[]? | (.message // .edited_message // .my_chat_member // .channel_post) | .chat.id? // empty] | last // empty' 2>/dev/null) || true
            if [ -n "$chat" ]; then
              echo "$chat" > .n8n-watch/chat; new_chat=true; changed=true
              echo "Found the Telegram chat."
            else
              echo "::warning::Telegram bot has no chat yet. Open the bot in Telegram and press Start."
            fi
          fi

          cairo() { TZ=Africa/Cairo date -d "@$1" '+%a %d %b, %I:%M %p'; }

          send() {
            local text="$1" sent=0
            if [ -n "$WHATSAPP_PHONE" ] && [ -n "$GREENAPI_URL" ] && [ -n "$GREENAPI_ID" ] && [ -n "$GREENAPI_TOKEN" ]; then
              digits=$(printf '%s' "$WHATSAPP_PHONE" | tr -cd '0-9')
              body=$(jq -n --arg c "$digits@c.us" --arg m "$text" '{chatId:$c, message:$m}')
              code=$(curl -sS -m 30 -o ga.txt -w '%{http_code}' -H 'Content-Type: application/json' \
                -d "$body" "${GREENAPI_URL%/}/waInstance$GREENAPI_ID/sendMessage/$GREENAPI_TOKEN") || true
              code=${code:-000}
              echo "WhatsApp (Green-API) answer: $code $(head -c 300 ga.txt 2>/dev/null | tr -d '\n')"
              [ "$code" = 200 ] && sent=1
            fi
            if [ -n "$WHATSAPP_PHONE" ] && [ -n "$WHATSAPP_APIKEY" ] && [ $sent = 0 ]; then
              code=$(curl -sS -m 30 -o wa.txt -w '%{http_code}' -G https://api.callmebot.com/whatsapp.php \
                --data-urlencode "phone=$WHATSAPP_PHONE" \
                --data-urlencode "apikey=$WHATSAPP_APIKEY" \
                --data-urlencode "text=$text") || true
              code=${code:-000}
              echo "WhatsApp answer: $code $(head -c 300 wa.txt 2>/dev/null | tr -d '\n')"
              [ "$code" = 200 ] && sent=1
            fi
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$chat" ]; then
              code=$(curl -sS -m 30 -o tg.txt -w '%{http_code}' "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                --data-urlencode "chat_id=$chat" --data-urlencode "text=$text") || true
              code=${code:-000}
              echo "Telegram answer: $code"
              [ "$code" = 200 ] && sent=1
            fi
            [ $sent = 1 ] || echo "::warning::No alert was delivered (secrets missing or the service refused)."
          }

          # Up = /healthz answers 200. Before calling it down, try 4 times over
          # about 6 minutes so a short Tailscale restart is not an alarm.
          now_state=down
          for i in 1 2 3 4; do
            code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$HEALTH_URL") || true
            code=${code:-000}
            echo "Try $i: $code"
            if [ "$code" = 200 ]; then now_state=up; break; fi
            if [ $i -lt 4 ]; then sleep 110; fi
          done

          now=$(date -u +%s)
          echo "Before: $prev  Now: $now_state"

          if [ "$TEST" = "true" ] || [ "$new_chat" = true ]; then
            send "✅ Static OS test: n8n watch is working. n8n is ${now_state^^} right now ($(cairo $now) Cairo time)."
          fi

          if [ "$prev" = up ] && [ "$now_state" = down ]; then
            send "🔴 Static OS: n8n server is OFFLINE since about $(cairo $now) Cairo time. Posters, scheduling and website sync are paused. Check the Dell PC (power, internet, Docker, Tailscale)."
            since=$now; changed=true
          elif [ "$prev" = down ] && [ "$now_state" = up ]; then
            mins=$(( (now - since) / 60 ))
            send "🟢 Static OS: n8n server is back ONLINE ($(cairo $now) Cairo time). It was offline for about $((mins / 60))h $((mins % 60))m."
            since=$now; changed=true
          fi

          echo "$now_state" > .n8n-watch/state
          echo "$since" > .n8n-watch/since
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "### n8n is $now_state" >> "$GITHUB_STEP_SUMMARY"

      - name: Remember the new state
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .n8n-watch
          key: n8n-watch-${{ github.run_id }}
