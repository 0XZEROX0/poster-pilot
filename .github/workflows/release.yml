name: Release

# When main carries a version (package.json) that has no release yet, tag it and
# publish a normal, stable GitHub release (never a pre-release or a draft).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION is already released."
            exit 0
          fi
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Static OS $VERSION" \
            --generate-notes \
            --latest
